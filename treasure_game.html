<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻宝冒险记 - 神秘的古代宝藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #b0b0b0;
            margin-bottom: 2rem;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .scene {
            position: relative;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-size: cover;
            background-position: center;
            transition: all 1s ease-in-out;
        }
        
        .scene-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
        }
        
        .scene-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .scene-description {
            font-size: 1.2rem;
            line-height: 1.6;
            text-align: center;
            max-width: 80%;
            margin: 0 auto 2rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem;
            border-radius: 10px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        button {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(30deg);
            transition: all 0.6s;
            z-index: 0;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button span {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .start-btn {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            color: white;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .log-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .log-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #f39c12;
        }
        
        .log-entry {
            margin-bottom: 0.8rem;
            padding: 0.8rem;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .log-entry::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: #f39c12;
        }
        
        .log-entry.error {
            background: rgba(231, 76, 60, 0.2);
        }
        
        .log-entry.error::before {
            background: #e74c3c;
        }
        
        .progress-container {
            margin-top: 1rem;
            text-align: center;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            transition: width 0.5s ease;
        }
        
        .progress-text {
            color: #b0b0b0;
            font-size: 0.9rem;
        }
        
        .character {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-size: 3rem;
            transition: all 1s ease-in-out;
            animation: idle 2s infinite alternate;
        }
        
        @keyframes idle {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-10px);
            }
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loader {
            display: none;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }
        
        .loader.active {
            display: flex;
        }
        
        .loader-content {
            text-align: center;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .scene {
                height: 300px;
            }
            
            .scene-description {
                font-size: 1rem;
                max-width: 95%;
            }
            
            .controls {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>寻宝冒险记</h1>
            <p class="subtitle">一场充满挑战的神秘冒险，探索古老的遗迹，解开隐藏的谜题</p>
        </header>
        
        <div class="game-container">
            <div class="scene" id="gameScene">
                <div class="scene-overlay">
                    <h2 class="scene-title" id="sceneTitle">欢迎来到寻宝冒险记</h2>
                    <p class="scene-description" id="sceneDescription">点击开始按钮，踏上寻找传说中古代宝藏的旅程...</p>
                    <div class="character" id="gameCharacter">🧙‍♂️</div>
                </div>
            </div>
            
            <div class="controls">
                <button id="startBtn" class="start-btn"><span>🏰 开始冒险</span></button>
                <button id="restartBtn" class="restart-btn" disabled><span>🔄 重新开始</span></button>
            </div>
            
            <div class="log-container">
                <h2 class="log-title">冒险日志</h2>
                <div id="adventureLog" class="log-content">
                    <div class="log-entry log-info">冒险尚未开始...</div>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="progressText">进度: 0%</div>
                </div>
            </div>
        </div>
        
        <div class="loader" id="gameLoader">
            <div class="loader-content">
                <div class="loader-spinner"></div>
                <p id="loaderText">准备冒险...</p>
            </div>
        </div>
    </div>
    
    <script src="treasure.js"></script>

            treasure: {

            failure: {
                background: 'linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), #607D8B',
                character: '💀',
                title: '冒险失败'
            }
        };
        
        // 添加日志条目
        function addToLog(message, isError = false) {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${isError ? 'error' : ''}`;
            logEntry.textContent = message;
            logEntry.classList.add('fade-in');
            
            // 添加到日志容器的顶部
            if (adventureLog.firstChild) {
                adventureLog.insertBefore(logEntry, adventureLog.firstChild);
            } else {
                adventureLog.appendChild(logEntry);
            }
            
            // 自动滚动到最新日志
            adventureLog.scrollTop = 0;
        }
        
        // 更新进度条
        function updateProgress(percentage) {
            progressFill.style.width = `${percentage}%`;
            progressText.textContent = `进度: ${percentage}%`;
        }
        
        // 显示指定场景
        function showScene(sceneType, description = '') {
            const scene = scenes[sceneType];
            if (scene) {
                gameScene.style.background = scene.background;
                gameCharacter.textContent = scene.character;
                sceneTitle.textContent = scene.title;
                
                if (description) {
                    sceneDescription.textContent = description;
                }
            }
        }
        
        // 显示加载指示器
        function showLoader(text = '准备冒险...') {
            loaderText.textContent = text;
            gameLoader.classList.add('active');
        }
        
        // 隐藏加载指示器
        function hideLoader() {
            gameLoader.classList.remove('active');
        }
        
        // 重置游戏
        function resetGame() {
            adventureLog.innerHTML = '<div class="log-entry log-info">冒险尚未开始...</div>';
            updateProgress(0);
            
            sceneTitle.textContent = '欢迎来到寻宝冒险记';
            sceneDescription.textContent = '点击开始按钮，踏上寻找传说中古代宝藏的旅程...';
            gameCharacter.textContent = '🧙‍♂️';
            gameScene.style.background = '';
            
            startBtn.disabled = false;
            restartBtn.disabled = true;
        }
        
        // 移动角色动画
        function moveCharacter() {
            gameCharacter.style.transition = 'all 2s ease-in-out';
            gameCharacter.style.left = 'calc(100% - 5rem)';
            
            setTimeout(() => {
                gameCharacter.style.transition = 'all 0.5s ease-in-out';
                gameCharacter.style.left = '2rem';
            }, 2000);
        }
        
        // 开始冒险
        async function startAdventure() {
            startBtn.disabled = true;
            restartBtn.disabled = false;
            
            try {
                addToLog('冒险开始了！你踏上了寻找传说中宝藏的旅程...');
                updateProgress(0);
                
                // 显示图书馆场景
                showLoader('前往古老的图书馆...');
                await new Promise(resolve => setTimeout(resolve, 1000));
                hideLoader();
                showScene('library');
                updateProgress(10);
                
                // 获取初始线索
                addToLog('正在古老的图书馆中寻找线索...');
                showLoader('寻找古老的羊皮纸...');
                const initialClue = await TreasureMap.getInitialClue();
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(initialClue);
                sceneDescription.textContent = initialClue;
                updateProgress(20);
                
                // 解码古老文字
                addToLog('尝试解码古老的文字...');
                showLoader('解读神秘文字...');
                const decodedMap = await TreasureMap.decodeAncientScript(initialClue);
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(decodedMap);
                sceneDescription.textContent = decodedMap;
                updateProgress(30);
                
                // 显示森林场景
                await new Promise(resolve => setTimeout(resolve, 1000));
                moveCharacter();
                showLoader('前往迷雾森林...');
                await new Promise(resolve => setTimeout(resolve, 1000));
                hideLoader();
                showScene('forest');
                updateProgress(40);
                
                // 穿越迷雾森林
                addToLog('准备穿越迷雾森林...');
                showLoader('在迷雾中寻找正确的路径...');
                const forestPath = await TreasureMap.crossMistForest(decodedMap);
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(forestPath);
                sceneDescription.textContent = forestPath;
                updateProgress(50);
                
                // 显示神庙场景
                await new Promise(resolve => setTimeout(resolve, 1000));
                moveCharacter();
                showLoader('前往古老神庙...');
                await new Promise(resolve => setTimeout(resolve, 1000));
                hideLoader();
                showScene('temple');
                updateProgress(60);
                
                // 探索神庙
                addToLog('开始探索古老的神庙...');
                showLoader('寻找密室入口...');
                const templeDiscovery = await TreasureMap.searchTemple(forestPath);
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(templeDiscovery);
                sceneDescription.textContent = templeDiscovery;
                updateProgress(70);
                
                // 解开石门谜题
                addToLog('准备解开石门上的谜题...');
                showLoader('破解古老的谜题...');
                const puzzleSolved = await TreasureMap.solveStoneDoorPuzzle(templeDiscovery);
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(puzzleSolved);
                sceneDescription.textContent = puzzleSolved;
                updateProgress(80);
                
                // 显示海底遗迹场景（新增情节）
                await new Promise(resolve => setTimeout(resolve, 1000));
                moveCharacter();
                showLoader('探索海底遗迹...');
                await new Promise(resolve => setTimeout(resolve, 1000));
                hideLoader();
                showScene('underwater');
                updateProgress(90);
                
                // 探索海底遗迹（新增情节）
                addToLog('潜入神秘的海底遗迹...');
                showLoader('在海底寻找宝藏线索...');
                const underwaterSecret = await TreasureMap.exploreUnderwaterRuins();
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(underwaterSecret);
                sceneDescription.textContent = underwaterSecret;
                updateProgress(95);
                
                // 显示宝藏场景
                await new Promise(resolve => setTimeout(resolve, 1000));
                moveCharacter();
                showLoader('寻找最终宝藏...');
                await new Promise(resolve => setTimeout(resolve, 1000));
                hideLoader();
                showScene('treasure');
                updateProgress(100);
                
                // 打开宝箱
                addToLog('终于找到了传说中的宝箱！');
                showLoader('开启神秘宝箱...');
                const finalTreasure = await TreasureMap.openTreasureBox();
                await new Promise(resolve => setTimeout(resolve, 500));
                hideLoader();
                addToLog(finalTreasure);
                sceneDescription.textContent = finalTreasure;
                
                addToLog('恭喜你成功完成了寻宝之旅！🎉', false);
                
                // 添加特殊效果
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.top = '0';
                confetti.style.left = '0';
                confetti.style.width = '100%';
                confetti.style.height = '100%';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '9999';
                confetti.innerHTML = `
                    ${Array.from({ length: 100 }).map((_, i) => `
                        <div style="
                            position: absolute;
                            top: -20px;
                            left: ${Math.random() * 100}%;
                            width: ${5 + Math.random() * 10}px;
                            height: ${5 + Math.random() * 10}px;
                            background: ${['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#1abc9c'][Math.floor(Math.random() * 6)]};
                            transform: rotate(${Math.random() * 360}deg);
                            animation: fall ${3 + Math.random() * 5}s linear forwards;
                            opacity: 0.8;
                            border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                        "></div>
                    `).join('')}
                `;
                document.body.appendChild(confetti);
                
                // 添加动画样式
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes fall {
                        to {
                            transform: translateY(100vh) rotate(720deg);
                        }
                    }
                `;
                document.head.appendChild(style);
                
                // 移除庆祝效果
                setTimeout(() => {
                    if (confetti && confetti.parentNode) {
                        confetti.parentNode.removeChild(confetti);
                    }
                    if (style && style.parentNode) {
                        style.parentNode.removeChild(style);
                    }
                }, 10000);
                
            } catch (error) {
                console.error('冒险出错:', error);
                
                // 显示失败场景
                showScene('failure', error);
                addToLog(`错误: ${error}`, true);
                
                // 显示重试按钮
                restartBtn.disabled = false;
            }
        }
        
        // 事件监听
        startBtn.addEventListener('click', startAdventure);
        restartBtn.addEventListener('click', resetGame);
        
        // 初始化游戏
        resetGame();
    </script>
